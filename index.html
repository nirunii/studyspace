<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudySpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF7F0;--card:#FFFFFF;--ink:#1F4D3A;--muted:#5F8573;--mint:#BDEBD3;--leaf:#3FA67B;--peach:#FFD9C7;--butter:#FFF0B3;--line:#D5EBDF;--shadow:0 6px 18px rgba(63,166,123,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F231B;--card:#193328;--ink:#E4F6EC;--muted:#9CC2B0;--mint:#2C5B47;--leaf:#6FD6A6;--peach:#6A4636;--butter:#625A2A;--line:#2A4A3B;--shadow:none}}
:root[data-theme="dark"]{--bg:#0F231B;--card:#193328;--ink:#E4F6EC;--muted:#9CC2B0;--mint:#2C5B47;--leaf:#6FD6A6;--peach:#6A4636;--butter:#625A2A;--line:#2A4A3B;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3,.num,.brand{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:20px;min-height:100vh}
aside{background:var(--card);border-radius:28px;padding:22px 14px;box-shadow:var(--shadow);position:sticky;top:20px;height:calc(100vh - 40px)}
.brand{font-size:1.5rem;display:flex;gap:10px;align-items:center;margin:0 10px 26px}
.brand b{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--leaf);color:#fff}
aside a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;color:var(--muted);text-decoration:none;margin-bottom:4px}
aside a:hover{background:var(--bg)}
aside a.on{background:var(--mint);color:var(--ink)}
main{max-width:1600px;width:100%;min-width:0;padding-bottom:40px}
.view{display:none}.view.on{display:block}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(1.8rem,4vw,2.4rem)}
.sub{color:var(--muted);margin:4px 0 0}
.btn{background:var(--leaf);color:#fff;border:0;border-radius:99px;padding:11px 22px;font-weight:700;box-shadow:0 4px 0 rgba(31,77,58,.2)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.red{background:var(--peach);color:var(--ink);box-shadow:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.card h2{font-size:1.2rem;margin-bottom:12px}
.stat{display:flex;gap:14px;align-items:center}
.stat i{font-style:normal;font-size:1.6rem;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--bg-i,var(--mint))}
.stat .num{font-size:2rem}
.stat small{color:var(--muted);display:block}
ul{list-style:none;margin:0;padding:0}
.it{display:flex;gap:12px;align-items:center;padding:10px 6px;border-radius:14px;cursor:pointer}
.it:hover{background:var(--bg)}
.it .bar{width:6px;align-self:stretch;border-radius:6px;flex:none}
.it .tx{flex:1;min-width:0}
.it b{display:block;overflow-wrap:anywhere}
.it small{color:var(--muted);font-weight:600}
.it p{margin:4px 0 0;font-size:.9rem;color:var(--muted);font-weight:500}
.it.done b{text-decoration:line-through;opacity:.5}
.tick{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.chip{border:0;border-radius:99px;padding:5px 13px;font-size:.82rem;font-weight:700;color:var(--ink);white-space:nowrap}
.chip.p{background:var(--peach)}.chip.i{background:var(--butter)}.chip.c{background:var(--mint)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-weight:600}
.prog{height:14px;border-radius:99px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--leaf);transition:width .5s}
.subs{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.subc{cursor:pointer;border-top:10px solid var(--c)}
.subc h3{font-size:1.25rem}
.subc small{display:block;color:var(--muted)}
.code{display:inline-block;background:var(--c);color:#12301f;border-radius:99px;padding:2px 12px;font-size:.8rem;margin-bottom:8px}
.cd{font-family:Fredoka,sans-serif;font-size:1.5rem;color:var(--leaf)}
.exam{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;cursor:pointer;border-left:10px solid var(--c)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--card);border-radius:20px;padding:12px;min-height:170px;box-shadow:var(--shadow)}
.day.today{outline:3px solid var(--leaf)}
.day h3{font-size:1rem;margin-bottom:8px}
.ses{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:14px;background:var(--bg);border-left:6px solid var(--c);margin-bottom:8px;cursor:pointer;font-size:.88rem}
.ses.done{opacity:.55}
.ses.done b{text-decoration:line-through}
.ses b{display:block;line-height:1.2}
.ses small{color:var(--muted)}
.wkctl{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.78rem;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--leaf);border-radius:10px 10px 4px 4px;min-height:4px;margin:3px 0}
.spr{margin-bottom:14px}
.spr div:first-child{display:flex;justify-content:space-between;margin-bottom:5px}
dialog{border:0;border-radius:28px;padding:26px;width:min(460px,92vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(31,77,58,.45)}
dialog h2{margin-bottom:16px}
#dlgF{display:grid;gap:12px}
#dlgF label,#dlgF legend{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;color:var(--ink)}
fieldset{border:0;padding:0;margin:0}
.sws{display:flex;gap:10px}
.sw input{position:absolute;opacity:0}
.sw span{display:block;width:34px;height:34px;border-radius:50%;cursor:pointer}
.sw input:checked+span{outline:3px solid var(--ink);outline-offset:2px}
.sw input:focus-visible+span{outline:3px solid var(--leaf)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:820px){
 .app{grid-template-columns:1fr;padding:14px 14px 100px}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;border-radius:22px 22px 0 0;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 aside .brand{display:none}
 aside a{flex-direction:column;gap:0;font-size:.68rem;padding:6px 7px;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside aria-label="Main">
  <div class="brand"><b>S</b>StudySpace</div>
  <a href="#dashboard" data-v="dashboard"><span aria-hidden="true">🏡</span>Dashboard</a>
  <a href="#subjects" data-v="subjects"><span aria-hidden="true">📚</span>Subjects</a>
  <a href="#assignments" data-v="assignments"><span aria-hidden="true">📝</span>Tasks</a>
  <a href="#planner" data-v="planner"><span aria-hidden="true">🗓️</span>Planner</a>
  <a href="#exams" data-v="exams"><span aria-hidden="true">🎯</span>Exams</a>
  <a href="#progress" data-v="progress"><span aria-hidden="true">🌱</span>Progress</a>
</aside>
<main>
  <section class="view" id="v-dashboard"></section>
  <section class="view" id="v-subjects"></section>
  <section class="view" id="v-assignments"></section>
  <section class="view" id="v-planner"></section>
  <section class="view" id="v-exams"></section>
  <section class="view" id="v-progress"></section>
</main>
</div>
<dialog id="dlg"><form id="dlgF" method="dialog"></form></dialog>

<script>
var $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
var ymd=d=>{var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
var TODAY=ymd(new Date()),D=n=>{var d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
var esc=s=>{var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
var COL=["#3FA67B","#7FB8FF","#FFB38A","#C9A7FF","#FF8FA3","#F4C95D"];
var ST={Pending:"p","In Progress":"i",Completed:"c","Not started":"p",Studying:"i",Ready:"c"};
var CYC={assignments:["status",["Pending","In Progress","Completed"]],exams:["prep",["Not started","Studying","Ready"]]};
var S={subjects:[],assignments:[],sessions:[],exams:[],n:20};
try{var raw=localStorage.getItem("studyspace-app");if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem("studyspace-app",JSON.stringify(S))}catch(e){}}
if(!S.subjects.length&&!S.seeded){S.seeded=1;
 S.subjects=[{id:1,name:"Data Structures",code:"CS201",lecturer:"Dr. Perera",color:COL[0]},{id:2,name:"Calculus",code:"MA101",lecturer:"Prof. Silva",color:COL[1]},{id:3,name:"Academic Writing",code:"EN110",lecturer:"Ms. Fernando",color:COL[2]}];
 S.assignments=[{id:4,title:"Linked list implementation",subject:1,due:D(3),status:"In Progress",desc:"Singly and doubly linked lists in Java."},{id:5,title:"Problem set 5",subject:2,due:D(6),status:"Pending",desc:""},{id:6,title:"Essay draft",subject:3,due:D(10),status:"Pending",desc:"1,500 words on study habits."}];
 S.sessions=[{id:7,subject:1,topic:"Trees revision",date:TODAY,start:"16:00",end:"17:30",done:false},{id:8,subject:2,topic:"Integration practice",date:TODAY,start:"18:00",end:"19:00",done:false},{id:9,subject:3,topic:"Outline essay",date:D(1),start:"15:00",end:"16:00",done:false},{id:10,subject:1,topic:"Lab prep",date:D(-1),start:"14:00",end:"16:00",done:true},{id:11,subject:2,topic:"Limits",date:D(-2),start:"17:00",end:"18:30",done:true}];
 S.exams=[{id:12,title:"Midterm exam",subject:2,date:D(14),prep:"Studying"},{id:13,title:"Quiz 2",subject:1,date:D(8),prep:"Not started"}];save()}

var sub=id=>S.subjects.find(s=>s.id==id)||{name:"Deleted subject",color:"#aaa",code:"",lecturer:""};
var fmt=d=>new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
var left=d=>Math.round((new Date(d+"T00:00")-new Date(TODAY+"T00:00"))/864e5);
var cd=d=>{var n=left(d);return n<0?"passed":n===0?"today":n===1?"tomorrow":"in "+n+" days"};
var hrs=s=>{var a=s.start.split(":"),b=s.end.split(":");return Math.max(0,((+b[0])*60+(+b[1])-(+a[0])*60-(+a[1]))/60)};
var wkDays=base=>{var d=new Date(base+"T00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);return[0,1,2,3,4,5,6].map(i=>{var x=new Date(d);x.setDate(x.getDate()+i);return ymd(x)})};
var byTime=(a,b)=>(a.date+a.start>b.date+b.start?1:-1);
var pct=(a,b)=>b?Math.round(a/b*100):0;
var wOff=0;

/* shared pieces */
function head(t,s,k,label){return `<div class="head"><div><h1>${t}</h1><p class="sub">${s}</p></div>${k?`<button class="btn" data-add="${k}">${label}</button>`:""}</div>`}
function asg(a,full){var s=sub(a.subject);return `<li class="it" data-edit="assignments" data-id="${a.id}"><span class="bar" style="background:${s.color}"></span><div class="tx"><b>${esc(a.title)}</b><small>${esc(s.name)} · due ${fmt(a.due)} (${cd(a.due)})</small>${full&&a.desc?`<p>${esc(a.desc)}</p>`:""}</div><button class="chip ${ST[a.status]}" data-cyc="assignments" data-id="${a.id}" aria-label="Change status">${a.status}</button></li>`}
function exm(e){var s=sub(e.subject);return `<li class="it" data-edit="exams" data-id="${e.id}"><span class="bar" style="background:${s.color}"></span><div class="tx"><b>${esc(e.title)}</b><small>${esc(s.name)} · ${fmt(e.date)}</small></div><span class="cd">${left(e.date)<0?"–":left(e.date)+"d"}</span></li>`}
function ses(x,time){var s=sub(x.subject);return `<div class="ses ${x.done?"done":""}" style="--c:${s.color}" data-edit="sessions" data-id="${x.id}"><input type="checkbox" class="tick" data-id="${x.id}" aria-label="Mark session done"${x.done?" checked":""}><div><b>${esc(x.topic||s.name)}</b><small>${x.start}–${x.end}${time?"":" · "+esc(s.name)}</small></div></div>`}
function bars(a,unit){var m=Math.max(1,...a.map(x=>x[1]));return `<div class="bars">${a.map(x=>`<div title="${x[1]} ${unit}">${x[1]?+x[1].toFixed(1):""}<i style="height:${x[1]/m*100}%"></i>${x[0]}</div>`).join("")}</div>`}

/* views */
function vDash(){
 var wk=wkDays(TODAY),pw=S.sessions.filter(s=>wk.includes(s.date)),dn=pw.filter(s=>s.done),
 up=S.assignments.filter(a=>a.status!=="Completed").sort((a,b)=>a.due>b.due?1:-1).slice(0,4),
 ex=S.exams.filter(e=>left(e.date)>=0).sort((a,b)=>a.date>b.date?1:-1),
 td=S.sessions.filter(s=>s.date===TODAY).sort(byTime),h=new Date().getHours();
 var st=(i,n,l,c)=>`<div class="card stat"><i style="--bg-i:${c}">${i}</i><div><div class="num">${n}</div><small>${l}</small></div></div>`;
 $("#v-dashboard").innerHTML=head((h<12?"Good morning":h<18?"Good afternoon":"Good evening")+"! 🌿",new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}))+
 `<div class="grid">${st("📚",S.subjects.length,"Subjects","var(--mint)")}${st("📝",S.assignments.filter(a=>a.status!=="Completed").length,"Open assignments","var(--butter)")}${st("🎯",ex.length,"Upcoming exams","var(--peach)")}${st("⏰",td.length,"Study tasks today","var(--mint)")}</div>
 <div class="grid two"><div class="card"><h2>Today’s study tasks</h2>${td.length?td.map(x=>ses(x,1)).join(""):'<p class="empty">No sessions today. Add one in the planner.</p>'}</div>
 <div class="card"><h2>Weekly study progress</h2><div class="num" style="font-size:2.4rem">${pct(dn.length,pw.length)}%</div><p class="sub" style="margin:0 0 12px">${dn.length} of ${pw.length} sessions done · ${+dn.reduce((a,s)=>a+hrs(s),0).toFixed(1)} hours studied</p><div class="prog"><i style="width:${pct(dn.length,pw.length)}%"></i></div></div></div>
 <div class="grid two"><div class="card"><h2>Upcoming assignments</h2><ul>${up.length?up.map(a=>asg(a)).join(""):'<li class="empty">All caught up! 🎉</li>'}</ul></div>
 <div class="card"><h2>Upcoming exams</h2><ul>${ex.length?ex.slice(0,3).map(exm).join(""):'<li class="empty">No exams coming up.</li>'}</ul></div></div>`}

function vSubj(){
 $("#v-subjects").innerHTML=head("Subjects","Everything you’re studying this semester.","subjects","+ Add subject")+
 (S.subjects.length?`<div class="subs">${S.subjects.map(s=>`<div class="card subc" style="--c:${s.color}" data-edit="subjects" data-id="${s.id}"><span class="code">${esc(s.code||"No code")}</span><h3>${esc(s.name)}</h3><small>${esc(s.lecturer||"No lecturer added")}</small></div>`).join("")}</div>`:'<div class="card empty">No subjects yet. Add your first one.</div>')}

function vAsg(){
 var l=[...S.assignments].sort((a,b)=>(a.status==="Completed")-(b.status==="Completed")||(a.due>b.due?1:-1));
 $("#v-assignments").innerHTML=head("Assignments","Tap a status to move it along: Pending, In Progress, Completed.","assignments","+ Add assignment")+
 `<div class="card"><ul>${l.length?l.map(a=>asg(a,1)).join(""):'<li class="empty">No assignments yet.</li>'}</ul></div>`}

function vPlan(){
 var d0=new Date(TODAY+"T00:00");d0.setDate(d0.getDate()+wOff*7);var wk=wkDays(ymd(d0)),nm=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
 $("#v-planner").innerHTML=head("Study planner",fmt(wk[0])+" – "+fmt(wk[6]),"sessions","+ Add session")+
 `<div class="wkctl"><button class="btn alt" data-wk="-1">‹ Previous</button><button class="btn alt" data-wk="0">This week</button><button class="btn alt" data-wk="1">Next ›</button></div>
 <div class="wk">${wk.map((d,i)=>`<div class="day ${d===TODAY?"today":""}"><h3>${nm[i]} ${new Date(d+"T00:00").getDate()}</h3>${S.sessions.filter(s=>s.date===d).sort(byTime).map(x=>ses(x)).join("")||'<small style="color:var(--muted)">Free</small>'}</div>`).join("")}</div>`}

function vExam(){
 var l=[...S.exams].sort((a,b)=>a.date>b.date?1:-1);
 $("#v-exams").innerHTML=head("Exam tracker","Know what’s coming and how ready you are.","exams","+ Add exam")+
 (l.length?l.map(e=>{var s=sub(e.subject);return `<div class="card exam" style="--c:${s.color};margin-bottom:14px" data-edit="exams" data-id="${e.id}"><div><h3>${esc(e.title)}</h3><small style="color:var(--muted)">${esc(s.name)} · ${fmt(e.date)}</small></div><div class="cd">${left(e.date)<0?"Done":left(e.date)===0?"Today!":left(e.date)+" days left"}</div><button class="chip ${ST[e.prep]}" data-cyc="exams" data-id="${e.id}" aria-label="Change preparation status">${e.prep}</button></div>`}).join(""):'<div class="card empty">No exams added yet.</div>')}

function vProg(){
 var dn=S.sessions.filter(s=>s.done),wk=wkDays(TODAY),nm=["M","T","W","T","F","S","S"],
 ac=S.assignments.filter(a=>a.status==="Completed").length,
 wh=wk.map((d,i)=>[nm[i],S.sessions.filter(s=>s.done&&s.date===d).reduce((a,s)=>a+hrs(s),0)]),
 mo=[3,2,1,0].map(k=>{var d=new Date(TODAY+"T00:00");d.setDate(d.getDate()-k*7);var w=wkDays(ymd(d));return["Wk of "+fmt(w[0]),S.sessions.filter(s=>s.done&&w.includes(s.date)).reduce((a,s)=>a+hrs(s),0)]}),
 st=(i,n,l)=>`<div class="card stat"><i>${i}</i><div><div class="num">${n}</div><small>${l}</small></div></div>`;
 $("#v-progress").innerHTML=head("Progress","See how your study habits are growing.")+
 `<div class="grid">${st("✅",dn.length,"Sessions completed")}${st("📝",pct(ac,S.assignments.length)+"%","Assignments completed")}${st("⏱️",+wh.reduce((a,x)=>a+x[1],0).toFixed(1),"Hours this week")}${st("🎯",S.exams.filter(e=>e.prep==="Ready").length+"/"+S.exams.length,"Exams ready")}</div>
 <div class="grid two"><div class="card"><h2>Study hours this week</h2>${bars(wh,"hours")}</div><div class="card"><h2>Monthly productivity</h2>${bars(mo,"hours")}<p class="sub" style="margin:8px 0 0">Study hours per week, last 4 weeks.</p></div></div>
 <div class="card"><h2>Subject progress</h2>${S.subjects.length?S.subjects.map(s=>{var ts=S.sessions.filter(x=>x.subject==s.id),ta=S.assignments.filter(x=>x.subject==s.id),d=ts.filter(x=>x.done).length+ta.filter(x=>x.status==="Completed").length,t=ts.length+ta.length;
  return `<div class="spr"><div><span>${esc(s.name)}</span><span>${d} of ${t} done</span></div><div class="prog"><i style="width:${pct(d,t)}%;background:${s.color}"></i></div></div>`}).join(""):'<p class="empty">Add a subject to see progress.</p>'}</div>`}

function renderAll(){vDash();vSubj();vAsg();vPlan();vExam();vProg()}

/* add / edit form */
var F={subjects:{t:"subject",f:[["name","Subject name","text"],["code","Subject code","text"],["lecturer","Lecturer name","text"],["color","Colour","color"]]},
assignments:{t:"assignment",f:[["title","Title","text"],["subject","Subject","subj"],["due","Deadline","date"],["status","Status","sel",["Pending","In Progress","Completed"]],["desc","Description","area"]],d:{status:"Pending",due:D(7)}},
sessions:{t:"study session",f:[["subject","Subject","subj"],["topic","What will you study?","text"],["date","Date","date"],["start","Start time","time"],["end","End time","time"]],d:{date:TODAY,start:"16:00",end:"17:00",done:false}},
exams:{t:"exam",f:[["title","Exam name","text"],["subject","Subject","subj"],["date","Exam date","date"],["prep","Preparation","sel",["Not started","Studying","Ready"]]],d:{date:D(14),prep:"Not started"}}};
var cur=null,armed=false;
function openForm(k,id){
 if(k!=="subjects"&&!S.subjects.length){location.hash="#subjects";return openForm("subjects")}
 var c=F[k],it=id?S[k].find(x=>x.id===id):Object.assign({subject:S.subjects[0]&&S.subjects[0].id,color:COL[S.subjects.length%6]},c.d);
 cur={k:k,id:id};armed=false;
 $("#dlgF").innerHTML=`<h2>${id?"Edit":"Add"} ${c.t}</h2>`+c.f.map(f=>{var n=f[0],l=f[1],t=f[2],v=it[n]==null?"":it[n],i;
  if(t==="sel"||t==="subj"){var op=t==="subj"?S.subjects.map(s=>[s.id,s.name]):f[3].map(x=>[x,x]);i=`<select name="${n}">${op.map(o=>`<option value="${esc(o[0])}"${o[0]==v?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`}
  else if(t==="area")i=`<textarea name="${n}" rows="3">${esc(v)}</textarea>`;
  else if(t==="color")return `<fieldset><legend>${l}</legend><div class="sws">${COL.map(x=>`<label class="sw"><input type="radio" name="${n}" value="${x}"${x===v?" checked":""} aria-label="Colour ${x}"><span style="background:${x}"></span></label>`).join("")}</div></fieldset>`;
  else i=`<input name="${n}" type="${t}" value="${esc(v)}"${/^(name|title|due|date|start|end)$/.test(n)?" required":""}>`;
  return `<label>${l}${i}</label>`}).join("")+
  `<div class="acts">${id?'<button type="button" class="btn red" id="delBtn">Delete</button>':""}<button type="button" class="btn alt" id="cancelBtn">Cancel</button><button class="btn" type="submit">Save</button></div>`;
 $("#dlg").showModal()}
$("#dlgF").onsubmit=e=>{e.preventDefault();var fd=new FormData(e.target),o={};
 F[cur.k].f.forEach(f=>{var v=fd.get(f[0]);o[f[0]]=f[2]==="subj"?+v:v});
 if(cur.id)Object.assign(S[cur.k].find(x=>x.id===cur.id),o);else{o.id=S.n++;if(cur.k==="sessions")o.done=false;S[cur.k].push(o)}
 save();$("#dlg").close();renderAll()};
$("#dlgF").onclick=e=>{
 if(e.target.id==="cancelBtn")$("#dlg").close();
 if(e.target.id==="delBtn"){if(!armed){armed=true;e.target.textContent=cur.k==="subjects"?"Tap again (removes its tasks too)":"Tap again to delete";return}
  var id=cur.id;S[cur.k]=S[cur.k].filter(x=>x.id!==id);
  if(cur.k==="subjects")["assignments","sessions","exams"].forEach(k=>S[k]=S[k].filter(x=>x.subject!==id));
  save();$("#dlg").close();renderAll()}};

/* clicks */
document.addEventListener("click",e=>{var t=e.target,c,w;
 if(c=t.closest("[data-cyc]")){var k=c.dataset.cyc,id=+c.dataset.id,f=CYC[k],it=S[k].find(x=>x.id===id);it[f[0]]=f[1][(f[1].indexOf(it[f[0]])+1)%3];save();renderAll();return}
 if(t.matches(".tick")){var s=S.sessions.find(x=>x.id===+t.dataset.id);s.done=t.checked;save();renderAll();return}
 if(c=t.closest("[data-edit]"))return openForm(c.dataset.edit,+c.dataset.id);
 if(c=t.closest("[data-add]"))return openForm(c.dataset.add);
 if(w=t.closest("[data-wk]")){wOff=w.dataset.wk==="0"?0:wOff+ +w.dataset.wk;vPlan()}});

function route(){var v=(location.hash||"#dashboard").slice(1);if(!$("#v-"+v))v="dashboard";
 $$(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));$$("aside a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));scrollTo(0,0)}
addEventListener("hashchange",route);
renderAll();route();
</script>
</body>
</html>
